name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test:unit excludes tests/unit/test_threat_modeling_live.test.ts, which
      # calls the real ihos-api over the network and times out/flakes in CI.
      # Run it on demand via `npm run test:integration` instead.
      - run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # src/lib/env.ts validates env at import time and hard-fails a production
      # build when required vars are absent. This CI build only verifies the
      # app compiles — real deployments (Vercel) inject real values — so
      # obviously-fake placeholders that satisfy the schema are used here.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-0000000000
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-00
          STANDARD_GRC_API_URL: https://ci-placeholder.invalid/api/v1
          CRON_SECRET: ci-placeholder-cron-secret-0000000000000000

      # Type-error ratchet. `next.config.ts` sets `ignoreBuildErrors: true`, so
      # the build above compiles regardless of type errors and `tsc --noEmit`
      # ran nowhere automatic. That made several structural invariants
      # unenforced — notably the ControlCode/ControlUuid brands in
      # src/lib/standard-api/identity.ts, whose whole purpose is to make the
      # control-identity mismatch a compile error, plus the @ts-expect-error
      # pinning it. A guard only a human remembers to run is not a guard.
      #
      # This does not fix the pre-existing errors. It stops the count growing,
      # which is what makes the brands load-bearing: widening one back to
      # `string` ADDS errors and fails here.
      #
      # Deliberately placed after the build, not in its own job: the count
      # depends on .next/ generated route types existing, so it is only
      # meaningful once the build has run. Reusing this job also avoids a
      # second npm ci.
      #
      # The baseline is whatever THIS environment measures, and it is not the
      # local number. A Windows/WSL tree with .next/ present counts 202; this
      # job counts 198. I predicted the gap but not its size, and guessed the
      # cause was .next/ alone — a fresh `npm ci` on Linux clearly also moves
      # it. Do not reconcile the two numbers; CI's is the one that gates.
      #
      # When someone fixes type errors, lower TSC_BASELINE in the same PR — a
      # falling number is the point of a ratchet.
      - name: Type errors must not increase
        env:
          TSC_BASELINE: 195
        run: |
          count=$(npx tsc --noEmit 2>&1 | grep -c 'error TS' || true)
          echo "tsc errors: $count (baseline $TSC_BASELINE)"
          if [ "$count" -gt "$TSC_BASELINE" ]; then
            echo "::error::type errors rose from $TSC_BASELINE to $count"
            npx tsc --noEmit 2>&1 | grep 'error TS' | head -40
            exit 1
          fi
          if [ "$count" -lt "$TSC_BASELINE" ]; then
            echo "::notice::$((TSC_BASELINE - count)) fewer than baseline — lower TSC_BASELINE to $count"
          fi
